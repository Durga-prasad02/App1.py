<!DOCTYPE html>
<html>
<head>
    <title>Generated Image</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
            text-align: center;
        }
        img {
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 15px #aaa;
        }
        a, button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
        }
    </style>
</head>
<body>

<h2>Generated Image</h2>
<p><b>Prompt:</b> {{ prompt }}</p>

<img src="/download/{{ image_name }}" alt="Generated Image">

<br><br>

<a href="/download/{{ image_name }}">Download Image</a>
<br><br>
<a href="/">Generate Another Image</a>

</body>
</html>
